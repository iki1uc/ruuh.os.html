:root{
  --bg:#05060a;
  --surface:#0a0d14;
  --surface-2:#111620;
  --line:#1b2233;
  --line-bright:#2a3652;
  --ink:#e8eef8;
  --muted:#7a8aa5;
  --faint:#3a465d;
  --accent:#e8b93c;
  --accent-2:#6ff0ff;
  --green:#3fb950;
  --red:#f85149;
  --warn:#d29922;
  --vio:#a78bfa;
  --pink:#f472b6;
  --font-mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  --font-serif:"Didot","Bodoni MT","Playfair Display",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#05060a;
    --surface:#0a0d14;
    --surface-2:#111620;
    --line:#1b2233;
    --line-bright:#2a3652;
    --ink:#e8eef8;
    --muted:#7a8aa5;
    --faint:#3a465d;
    --accent:#e8b93c;
    --accent-2:#6ff0ff;
    --green:#3fb950;
    --red:#f85149;
    --warn:#d29922;
    --vio:#a78bfa;
    --pink:#f472b6;
  }
}
*{
  box-sizing:border-box;
  margin:0;
  padding:0
}
html,body{
  background:var(--bg)
}
body{
  background:var(--bg);
  color:var(--ink);
  font:12px/1.55 var(--font-mono);
  min-height:100vh;
  overflow-x:clip;
}
button{
  font:inherit;
  color:inherit;
  background:none;
  border:none;
  cursor:pointer
}
/* ── HEADER ─────────────────────────────────── */
.top{
  position:sticky;
  z-index:100;
  background:rgba(5,6,10,.92);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1600px;
  margin:0 auto;
  padding:10px 16px;
  display:flex;
  gap:14px;
  align-items:center;
  flex-wrap:wrap;
}
.brand{
  font:900 15px/1 var(--font-serif);
  color:var(--accent);
  letter-spacing:1px
}
.brand small{
  display:block;
  font:600 9px/1 var(--font-mono);
  color:var(--muted);
  letter-spacing:.25em;
  margin-top:3px
}
.formula{
  font:600 11px/1 var(--font-mono);
  color:var(--accent-2);
  padding:4px 8px;
  border:1px solid var(--line-bright);
  letter-spacing:.1em;
}
.wege{
  display:flex;
  gap:4px;
  margin-left:auto;
  flex-wrap:wrap
}
.wege button{
  font:600 10px/1 var(--font-mono);
  padding:5px 9px;
  border:1px solid var(--line);
  color:var(--muted);
  letter-spacing:.1em;
  transition:.15s;
}
.wege button:hover{
  color:var(--accent);
  border-color:var(--accent)
}
.wege button.on{
  background:var(--accent);
  color:#05060a;
  border-color:var(--accent);
  font-weight:800
}
.status{
  font:600 10px/1 var(--font-mono);
  color:var(--green);
  padding:4px 8px;
  border:1px solid var(--line);
}
.status.warn{
  color:var(--warn)
}
/* ── LAYOUT ─────────────────────────────────── */
.layout{
  max-width:1600px;
  margin:0 auto;
  padding:12px 16px 180px;
  display:grid;
  grid-template-columns:280px 1fr 340px;
  gap:12px;
  min-height:calc(100vh - 130px);
}
@media(max-width:1100px){
  .layout{
    grid-template-columns:1fr
  }
}
.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px;
  padding:12px;
}
.panel h2{
  font:800 10px/1 var(--font-mono);
  color:var(--accent);
  letter-spacing:.25em;
  text-transform:uppercase;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.panel h2 .dim{
  color:var(--faint);
  font-weight:600;
  letter-spacing:.05em
}
/* ── LOGS (left) ────────────────────────────── */
.logs{
  font:11px/1.7 var(--font-mono);
  max-height:calc(100vh - 260px);
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.logs .ln{
  padding:2px 4px;
  color:var(--muted);
  border-left:2px solid transparent;
  transition:.1s;
  cursor:pointer;
  word-break:break-word;
}
.logs .ln:hover{
  background:var(--surface-2);
  color:var(--ink)
}
.logs .ln.k{
  color:var(--accent);
  border-left-color:var(--accent)
}
.logs .ln.e{
  color:var(--red);
  border-left-color:var(--red)
}
.logs .ln.ok{
  color:var(--green);
  border-left-color:var(--green)
}
.logs .ln .ts{
  color:var(--faint);
  font-size:9px;
  margin-right:6px
}
.logs .ln[data-act]:hover{
  background:var(--accent);
  color:#05060a
}
.logs .ln[data-act]:hover .ts{
  color:#05060a;
  opacity:.7
}
/* ── STAGE (center) ─────────────────────────── */
.stage{
  display:flex;
  flex-direction:column;
  gap:12px;
  min-width:0;
}
.geom-wrap{
  position:relative;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:4px;
  min-height:520px;
  overflow:hidden;
}
.geom-wrap h2{
  position:absolute;
  top:10px;
  left:14px;
  z-index:10;
  font:800 10px/1 var(--font-mono);
  color:var(--accent);
  letter-spacing:.25em;
  pointer-events:none;
}
#geom-canvas{
  display:block;
  width:100%;
  height:520px;
  cursor:grab;
  touch-action:none
}
#geom-canvas:active{
  cursor:grabbing
}
.geom-hint{
  position:absolute;
  bottom:10px;
  left:14px;
  font:10px/1.5 var(--font-mono);
  color:var(--faint);
  pointer-events:none;
}
/* ── 3 SITES TRIANGLE ───────────────────────── */
.triangle{
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:auto auto;
  gap:8px;
}
.tri-link{
  display:flex;
  flex-direction:column;
  gap:4px;
  padding:12px 14px;
  background:var(--surface);
  border:1px solid var(--line-bright);
  text-decoration:none;
  color:var(--ink);
  transition:.15s;
  min-width:0;
}
.tri-link:hover{
  border-color:var(--accent);
  color:var(--accent)
}
.tri-link.top{
  grid-column:1/-1;
  text-align:center;
  border-color:var(--accent);
  align-items:center
}
.tri-link .icon{
  font:900 20px/1 var(--font-mono);
  color:var(--accent)
}
.tri-link .name{
  font:800 12px/1 var(--font-mono)
}
.tri-link .role{
  font:600 9px/1 var(--font-mono);
  color:var(--muted);
  letter-spacing:.15em
}
/* ── PERM / MIX buttons ─────────────────────── */
.perm-btn{
  padding:6px 12px;
  border:1px solid var(--line);
  color:var(--muted);
  background:transparent;
  font:800 11px/1 var(--font-mono);
  letter-spacing:.15em;
  cursor:pointer;
  transition:.15s;
}
.perm-btn:hover{
  border-color:var(--accent);
  color:var(--accent)
}
.perm-btn.on{
  border-color:var(--accent);
  color:#05060a;
  background:var(--accent)
}
.mix-btn{
  padding:8px;
  border:1px solid var(--line);
  font:800 10px/1.3 var(--font-mono);
  color:var(--muted);
  transition:.15s;
  text-align:center;
}
.mix-btn small{
  font-weight:600;
  color:var(--faint);
  font-size:9px
}
.mix-btn:hover{
  border-color:var(--accent);
  color:var(--accent)
}
.mix-btn.on{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(232,185,60,.1)
}
/* ── 81 DA-SEIENDE (right) ──────────────────── */
.da-list{
  max-height:calc(100vh - 260px);
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:3px;
  font:10px/1.4 var(--font-mono);
}
.da-item{
  display:grid;
  grid-template-columns:1fr auto;
  gap:6px;
  align-items:center;
  padding:4px 6px;
  border-bottom:1px solid var(--line);
  transition:.1s;
}
.da-item:hover{
  background:var(--surface-2)
}
.da-item .name{
  color:var(--ink);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}
.da-item .name.slot{
  color:var(--faint);
  font-style:italic
}
.da-item .score{
  font:800 9px/1 var(--font-mono);
  padding:2px 6px;
  border:1px solid var(--line);
  border-radius:2px;
  letter-spacing:.05em;
}
.da-item .score.high{
  color:var(--green);
  border-color:var(--green)
}
.da-item .score.mid{
  color:var(--warn);
  border-color:var(--warn)
}
.da-item .score.low{
  color:var(--red);
  border-color:var(--red)
}
.da-item .score.slot{
  color:var(--faint);
  border-color:var(--line);
  font-style:italic
}
.da-summary{
  font:600 10px/1.5 var(--font-mono);
  color:var(--muted);
  padding:8px 4px 4px;
  border-top:1px solid var(--line);
  margin-top:6px;
}
.da-summary b{
  color:var(--accent)
}
/* ── KARTOR (bottom, fixed) ─────────────────── */
.kartor{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:99;
  background:rgba(5,6,10,.96);
  backdrop-filter:blur(14px);
  border-top:2px solid var(--accent);
  padding:8px 16px calc(8px + env(safe-area-inset-bottom, 0px));
}
.kartor-in{
  max-width:1600px;
  margin:0 auto;
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
  font:600 10px/1.4 var(--font-mono);
}
.kartor-in .tag{
  font:800 10px/1 var(--font-mono);
  color:#05060a;
  background:var(--accent);
  padding:3px 8px;
  letter-spacing:.15em;
}
.kartor-in .cell{
  display:flex;
  gap:4px;
  align-items:baseline;
}
.kartor-in .cell .k{
  color:var(--muted);
  letter-spacing:.05em
}
.kartor-in .cell .v{
  color:var(--ink);
  font-weight:800
}
.kartor-in .cell .v.h{
  color:var(--accent-2)
}
.kartor-in .cell .v.p{
  color:var(--accent)
}
.kartor-actions{
  margin-left:auto;
  display:flex;
  gap:6px
}
.kartor-actions button{
  padding:4px 10px;
  border:1px solid var(--line-bright);
  color:var(--muted);
  font:800 10px/1 var(--font-mono);
  letter-spacing:.15em;
  transition:.15s;
}
.kartor-actions button:hover{
  border-color:var(--accent);
  color:var(--accent)
}
.kartor-actions button:disabled{
  opacity:.45;
  cursor:wait
}
.kartor-actions button.save{
  border-color:var(--green);
  color:var(--green)
}
.kartor-actions button.load{
  border-color:var(--accent-2);
  color:var(--accent-2)
}
/* ── EL BURRO (bottom-right floating) ───────── */
.burro{
  position:fixed;
  right:16px;
  bottom:64px;
  z-index:98;
  background:var(--surface);
  border:1px solid var(--line-bright);
  border-radius:6px;
  padding:10px 12px;
  width:180px;
  text-align:center;
  font:10px/1.4 var(--font-mono);
  color:var(--muted);
}
.burro h3{
  font:800 10px/1 var(--font-mono);
  color:var(--accent);
  letter-spacing:.2em;
  margin-bottom:6px
}
#burro-canvas{
  display:block;
  width:100%;
  height:70px;
  cursor:pointer
}
.burro .info{
  font-size:9px;
  color:var(--faint);
  margin-top:4px;
  letter-spacing:.05em
}
@media(max-width:640px){
  .burro{
    display:none
  }
}
/* ── AXIOME (floating top-right under header) ─ */
.axiome{
  position:fixed;
  right:16px;
  top:76px;
  z-index:97;
  background:var(--surface);
  border:1px solid var(--line-bright);
  border-radius:4px;
  padding:10px;
  width:240px;
  font:10px/1.3 var(--font-mono);
}
.axiome h3{
  font:800 10px/1 var(--font-mono);
  color:var(--accent);
  letter-spacing:.2em;
  margin-bottom:8px
}
.axiome .grp{
  margin-bottom:6px
}
.axiome .grp .lbl{
  color:var(--faint);
  font-size:9px;
  margin-bottom:3px;
  letter-spacing:.15em
}
.axiome .grp .axi{
  display:flex;
  justify-content:space-between;
  padding:3px 6px;
  border:1px solid var(--line);
  margin-bottom:2px;
  cursor:pointer;
  transition:.15s;
  color:var(--muted);
  width:100%;
  text-align:left;
  font:inherit;
}
.axiome .grp .axi:hover{
  border-color:var(--accent);
  color:var(--accent)
}
.axiome .grp .axi.sealed{
  background:var(--accent);
  color:#05060a;
  border-color:var(--accent);
  font-weight:800
}
.axiome .seal{
  margin-top:8px;
  padding:6px;
  text-align:center;
  font:800 11px/1 var(--font-mono);
  letter-spacing:.15em;
  color:var(--faint);
  border:1px dashed var(--line);
  transition:.15s;
}
.axiome .seal.full{
  color:var(--accent-2);
  border:1px solid var(--accent-2);
  background:rgba(111,240,255,.1);
  animation:seal-pulse 1.5s ease-in-out infinite;
}
@keyframes seal-pulse{
  0%,100%{
    box-shadow:0 0 0 rgba(111,240,255,.4)
  }
  50%{
    box-shadow:0 0 20px rgba(111,240,255,.6)
  }
}
@media(max-width:1100px){
  .axiome{
    position:static;
    width:auto;
    margin:0 16px 12px
  }
}
/* ── ORGANE (13 floating windows) ───────────── */
.organe-bar{
  position:fixed;
  left:16px;
  bottom:64px;
  z-index:98;
  background:var(--surface);
  border:1px solid var(--line-bright);
  border-radius:4px;
  padding:8px;
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  width:280px;
  max-width:calc(100vw - 32px);
  max-height:180px;
  overflow-y:auto;
}
.organe-bar button{
  font:800 9px/1 var(--font-mono);
  padding:4px 8px;
  border:1px solid var(--line);
  color:var(--muted);
  letter-spacing:.05em;
  transition:.15s;
}
.organe-bar button:hover{
  border-color:var(--accent);
  color:var(--accent)
}
.organe-bar button.on{
  background:var(--accent);
  color:#05060a;
  border-color:var(--accent)
}
@media(max-width:640px){
  .organe-bar{
    display:none
  }
}
.organe-window{
  position:fixed;
  z-index:96;
  background:var(--surface);
  border:1px solid var(--line-bright);
  border-radius:6px;
  box-shadow:0 8px 40px rgba(0,0,0,.6);
  min-width:280px;
  min-height:160px;
  display:flex;
  flex-direction:column;
  max-width:calc(100vw - 24px);
}
.organe-window .head{
  padding:6px 10px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:move;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none;
  font:800 10px/1 var(--font-mono);
  color:var(--accent);
  letter-spacing:.15em;
  touch-action:none;
}
.organe-window .head button{
  color:var(--muted);
  font:800 12px/1 var(--font-mono);
  padding:0 4px;
}
.organe-window .head button:hover{
  color:var(--red)
}
.organe-window .body{
  flex:1;
  padding:10px;
  font:11px/1.5 var(--font-mono);
  color:var(--muted);
  overflow:auto;
}
.organe-window textarea{
  width:100%;
  min-height:120px;
  background:var(--bg);
  color:var(--ink);
  border:1px solid var(--line);
  padding:6px;
  font:11px/1.4 var(--font-mono);
  resize:vertical;
}
/* ── BOOT overlay ───────────────────────────── */
.boot{
  position:fixed;
  inset:0;
  z-index:10000;
  background:#000;
  color:var(--green);
  font:11px/1.6 var(--font-mono);
  padding:20px;
  overflow:auto;
}
.boot .ln{
  opacity:0;
  animation:fade .3s forwards
}
.boot .ln.ok{
  color:var(--green)
}
.boot .ln.warn{
  color:var(--warn)
}
.boot .ln.err{
  color:var(--red)
}
@keyframes fade{
  to{
    opacity:1
  }
}
.hidden{
  display:none!important
}
